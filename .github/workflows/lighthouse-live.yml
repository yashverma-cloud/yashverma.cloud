name: Lighthouse (live)

# Weekly audit of the live site against the same gates as CI (lighthouserc.live.json).
# A score below a gate fails the run, and GitHub emails the failure. The reports are kept
# as an artifact for 90 days.
on:
  schedule:
    - cron: '30 2 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          check-latest: true

      # Cloudflare's bot protection injects an inline script that the CSP blocks, so Lighthouse's
      # console-errors audit is skipped (lighthouserc.live.json) and checked in the last step instead,
      # on the pages.dev address: the same deployment and CSP, outside the bot protection (which
      # challenges a browser driven by Playwright).
      - name: Lighthouse CI against yashverma.cloud
        run: npx --yes @lhci/cli@0.15.1 autorun --config=lighthouserc.live.json

      - name: Install dependencies
        if: always()
        run: npm ci --no-audit --no-fund

      - name: No console errors from the site
        if: always()
        env:
          CHROME_CHANNEL: chrome
        run: >-
          node scripts/system/live-console.mjs
          https://yashverma-cloud.pages.dev/
          https://yashverma-cloud.pages.dev/work/karpenter-autoscaling/
          https://yashverma-cloud.pages.dev/work/cloud-cost-optimisation/

      - name: Keep the reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: lighthouse-live
          path: .lighthouseci/
          retention-days: 90
